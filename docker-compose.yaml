# nginx proxy address - http://172.17.0.1:8082

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  tooljet:
    image: tooljet/tooljet-ce:latest
    container_name: tooljet-app
    restart: unless-stopped
    logging: *default-logging
    networks:
      - tooljet
    ports:
      - "8082:3000"
    environment:
      TZ: ${TZ:-America/New_York}
      DATABASE_URL: postgres://${DB_USER_NAME:-tooljet}:${DB_USER_PASS:-changeme_db_password}@tooljet-db:5432/${DB_CREATE_DATABASE_NAME:-tooljet}
    volumes:
      - ./rootfs/data/tooljet:/data
      - ./rootfs/config/tooljet:/config
    depends_on:
      - tooljet-db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  tooljet-db:
    image: postgres:16-alpine
    container_name: tooljet-db
    restart: unless-stopped
    logging: *default-logging
    networks:
      - tooljet
    environment:
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-tooljet}
      POSTGRES_USER: ${DB_USER_NAME:-tooljet}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
    volumes:
      - ./rootfs/db/postgres/tooljet:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  tooljet:
    external: false
