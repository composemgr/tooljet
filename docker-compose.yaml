# nginx proxy address - http://172.17.0.1:8082

name: tooljet
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  tooljet:
    image: tooljet/tooljet-ce:latest
    pull_policy: always
    container_name: tooljet-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    logging: *default-logging
    networks:
      - tooljet
    ports:
      - "172.17.0.1:8082:3000"
    environment:
      TZ: ${TZ:-America/New_York}
      TOOLJET_HOST: http://${BASE_HOST_NAME:-localhost}:8082
      SECRET_KEY_BASE: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars}
      LOCKBOX_MASTER_KEY: ${LOCKBOX_MASTER_KEY:-changeme_lockbox_master_key_32c}
      DATABASE_URL: postgres://${DB_USER_NAME:-tooljet}:${DB_USER_PASS:-changeme_db_password}@tooljet-db:5432/${DB_CREATE_DATABASE_NAME:-tooljet}
      DEPLOYMENT_PLATFORM: docker
    volumes:
      - ./volumes/data/tooljet:/data
    depends_on:
      - tooljet-db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  tooljet-db:
    image: postgres:latest
    pull_policy: always
    container_name: tooljet-db
    restart: always
    logging: *default-logging
    networks:
      - tooljet
    environment:
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-tooljet}
      POSTGRES_USER: ${DB_USER_NAME:-tooljet}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
    volumes:
      - ./volumes/data/db/postgres/tooljet:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  tooljet:
    name: tooljet
    external: false
