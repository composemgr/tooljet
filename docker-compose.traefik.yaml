name: tooljet
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  tooljet:
    image: tooljet/tooljet-ce:latest
    container_name: tooljet-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      TOOLJET_HOST: ${TOOLJET_HOST:-https://${BASE_HOST_NAME:-$HOSTNAME}}
      TOOLJET_SERVER_PORT: '3000'
      PG_HOST: ${DB_HOST:-tooljet-db}
      PG_PORT: '5432'
      PG_DB: ${DB_CREATE_DATABASE_NAME:-tooljet}
      PG_USER: ${DB_USER_NAME:-tooljet}
      PG_PASS: ${DB_USER_PASS:-replace-with-a-random-password}
      LOCKBOX_MASTER_KEY: ${ENCRYPTION_KEY:-replace-with-a-random-lockbox-key}
      SECRET_KEY_BASE: ${APP_SECRET_KEY:-replace-with-a-random-secret-key}
      CONTAINER_NAME: tooljet-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    command: npm run start:prod
    volumes:
      - './volumes/data/tooljet:/tooljet'
    depends_on:
      tooljet-db:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3000']
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.tooljet-app.entrypoints=http'
      - 'traefik.http.routers.tooljet-app.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.tooljet-app.middlewares=tooljet-app-https-redirect'
      - 'traefik.http.middlewares.tooljet-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.tooljet-app-secure.entrypoints=https'
      - 'traefik.http.routers.tooljet-app-secure.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.tooljet-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.tooljet-app-secure.service=tooljet-app'
      - 'traefik.http.services.tooljet-app.loadbalancer.server.port=3000'
    networks:
      - tooljet
      - traefik
  tooljet-db:
    image: postgres:15-alpine
    container_name: tooljet-db
    hostname: tooljet-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      PGDATA: /var/lib/postgresql/data
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-tooljet}
      POSTGRES_USER: ${DB_USER_NAME:-tooljet}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
      CONTAINER_NAME: tooljet-db
    volumes:
      - './volumes/db/postgres/tooljet:/var/lib/postgresql/data:z'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER_NAME:-tooljet}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tooljet

networks:
  tooljet:
    name: tooljet
    external: false
  traefik:
    external: true
